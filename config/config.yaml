# 全局配置：CI 中通过环境变量 BASE_URL / HTTP_TIMEOUT 覆盖
base_url: http://127.0.0.1:8000
timeout: 10
log_level: INFO

# 只对网关类瞬时错误重试，业务失败绝不重试
retry:
  total: 2
  backoff: 0.3
  status_forcelist: [502, 503, 504]

users:
  user:
    username: alice
    password: alice123
  other:
    username: bob
    password: bob123
  admin:
    username: admin
    password: admin123
  rate_limit:
    username: carol
    password: carol123
  bad_password:
    username: alice
    password: wrong-password
