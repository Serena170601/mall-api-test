# 购物车类用例：写操作，会改变服务状态，标记 write 串行执行
cases:
  - id: cart_add_without_token
    title: 未登录加入购物车
    method: POST
    path: /api/cart/items
    auth: anonymous
    json: { productId: 1, quantity: 1 }
    expected:
      status: 401
      code: 4001
      schema: error

  - id: cart_add_off_sale_product
    title: 加购下架商品（productId=4）
    method: POST
    path: /api/cart/items
    auth: user
    json: { productId: 4, quantity: 1 }
    expected:
      status: 200
      code: 1002
      schema: error

  - id: cart_add_insufficient_stock
    title: 加购数量超过库存（productId=2，库存3，quantity=99）
    method: POST
    path: /api/cart/items
    auth: user
    json: { productId: 2, quantity: 99 }
    expected:
      status: 200
      code: 2002
      schema: error
