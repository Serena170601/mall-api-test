source:
  title: mini-mall mock
  version: 1.0.0
auth_notes: '先 POST /api/auth/login 获取 token，后续接口需 Authorization: Bearer <token>；业务失败返回
  HTTP 200 + code!=0，鉴权/越权/限流分别用 401/403/429。'
