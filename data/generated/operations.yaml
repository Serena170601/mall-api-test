    required: false
    schema: {}
  requestBody: null
  responses:
    '200':
      type: object
      additionalProperties: true
    '422':
      type: object
      properties:
        detail:
          type: array
          items:
            type: object
            required: &id001
            - loc
            - msg
            - type
            properties:
              loc:
                type: array
                items: {}
              msg:
                type: string
              type:
                type: string
              input: {}
              ctx:
                type: object
